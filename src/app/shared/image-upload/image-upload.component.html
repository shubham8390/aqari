<div>
  <label class="block text-xs font-semibold mb-1.5" style="color:var(--text-secondary);">Photos</label>
  <input type="file" accept="image/*" multiple (change)="onFilesSelected($event)"
         class="text-xs w-full rounded-xl px-3 py-2"
         style="background:var(--bg-raised);border:1px solid var(--border-mid);color:var(--text-secondary);" />
  @if (uploading()) {
    <p class="text-xs mt-2" style="color:var(--text-muted);">Uploading…</p>
  }
  @if (error()) {
    <p class="text-xs mt-2" style="color:var(--accent-red);">{{ error() }}</p>
  }
  @if (uploaded().length) {
    <div class="flex gap-2 mt-3 flex-wrap">
      @for (img of uploaded(); track img.id) {
        <div class="relative rounded-lg overflow-hidden" style="width:72px;height:56px;border:1px solid var(--border);">
          <img [src]="imageUrl(img.filename)" [alt]="img.original_name" class="w-full h-full object-cover" />
          <button type="button" (click)="removeImage(img.id)"
                  class="absolute top-0 right-0 text-xs px-1"
                  style="background:rgba(0,0,0,0.55);color:#fff;">×</button>
        </div>
      }
    </div>
  }
</div>
