<div class="search-split view-fade" [class.search-split--map-open]="mobileMapOpen">
  <!-- Left: Map -->
  <aside class="search-split-map">
    <app-project-map />
  </aside>

  <!-- Right: Chat -->
  <section class="search-split-chat">
    <div #chatScroll class="search-split-chat-scroll custom-scroll">
      @for (msg of chat.messages(); track msg.id) {
        <app-chat-message [message]="msg" (focusProject)="onFocusProject($event)" />
      }

      @if (chat.isTyping()) {
        <div class="flex gap-3 view-fade">
          <div class="flex items-center justify-center rounded-full text-xs font-medium flex-shrink-0 accent-avatar"
               style="width:36px;height:36px;">
            {{ agentInitial }}
          </div>
          <div class="flex items-center gap-1.5 px-4 py-3.5 rounded-2xl"
               style="background:var(--bg-raised);border:1px solid var(--border);border-top-left-radius:4px;">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      }
    </div>

    <div class="chat-input-area search-split-input px-4 md:px-6 pb-5 pt-4 flex-shrink-0"
         style="border-top:1px solid var(--border);background:var(--bg-card);">
      <div class="flex items-center gap-2.5 rounded-2xl px-4 py-1.5 transition-all duration-200"
           style="background:var(--bg-raised);border:1px solid var(--border-mid);"
           onfocusin="this.style.borderColor='var(--gold-border)';this.style.boxShadow='var(--focus-ring)'"
           onfocusout="this.style.borderColor='var(--border-mid)';this.style.boxShadow='none'">
        <input
          [(ngModel)]="inputText"
          (keydown)="onKeydown($event)"
          type="text"
          placeholder="Ask Rahaa anything about properties…"
          class="flex-1 bg-transparent border-none outline-none py-2 text-sm"
          style="color:var(--text-primary);" />
        <button
          (click)="send()"
          class="accent-btn flex items-center justify-center rounded-xl font-bold text-lg flex-shrink-0 transition-all duration-200 cursor-pointer"
          style="width:38px;height:38px;">
          ↑
        </button>
      </div>
      <div class="flex items-center justify-between mt-2 gap-3">
        <div class="text-center flex-1 hidden sm:block" style="font-size:11px;color:var(--text-muted);">
          Rahaa · Live property data · RERA listings · Pune market insights
        </div>
        <button type="button" class="search-map-toggle" (click)="toggleMobileMap()"
                [attr.aria-pressed]="mobileMapOpen"
                [attr.aria-label]="mobileMapOpen ? 'Show chat' : 'Show map'">
          {{ mobileMapOpen ? '💬 Chat' : '🗺️ Map' }}
        </button>
        <div class="chat-theme-toggle">
          <span class="chat-theme-label">{{ isLight ? 'Light' : 'Dark' }}</span>
          <button type="button" (click)="theme.toggle()" class="toggle-track" [class.active]="isLight" aria-label="Toggle theme">
            <div class="toggle-thumb"></div>
          </button>
        </div>
      </div>
    </div>
  </section>
</div>
