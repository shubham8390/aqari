<div class="flex flex-col flex-1 overflow-hidden view-fade">

  <!-- Chat Scroll -->
  <div #chatScroll class="flex-1 overflow-y-auto px-4 py-5 md:px-8 md:py-8 flex flex-col gap-5 custom-scroll">
    @for (msg of chat.messages(); track msg.id) {
      <app-chat-message [message]="msg" />
    }

    <!-- Typing indicator -->
    @if (chat.isTyping()) {
      <div class="flex gap-3 view-fade">
        <div class="flex items-center justify-center rounded-full text-xs font-medium flex-shrink-0 accent-avatar"
             style="width:36px;height:36px;">
          Z
        </div>
        <div class="flex items-center gap-1.5 px-4 py-3.5 rounded-2xl"
             style="background:var(--bg-raised);border:1px solid var(--border);border-top-left-radius:4px;">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    }
  </div>

  <!-- Quick Pills -->
  <div class="px-4 md:px-8 pb-3 flex gap-2 flex-wrap">
    @for (pill of quickPills; track pill.text) {
      <button
        (click)="sendQuick(pill.text)"
        class="text-xs px-3.5 py-1.5 rounded-full cursor-pointer transition-all duration-200 whitespace-nowrap"
        style="background:var(--bg-raised);border:1px solid var(--border);color:var(--text-secondary);"
        onmouseenter="this.style.borderColor='var(--gold-border)';this.style.color='var(--gold-light)';this.style.background='var(--gold-faint)'"
        onmouseleave="this.style.borderColor='var(--border)';this.style.color='var(--text-secondary)';this.style.background='var(--bg-raised)'">
        {{ pill.label }}
      </button>
    }
  </div>

  <!-- Input Area -->
  <div class="px-4 md:px-8 pb-5 pt-4 flex-shrink-0" style="border-top:1px solid var(--border);background:var(--bg-card);">
    <div class="flex items-center gap-2.5 rounded-2xl px-4 py-1.5 transition-all duration-200"
         style="background:var(--bg-raised);border:1px solid var(--border-mid);"
         onfocusin="this.style.borderColor='var(--gold-border)';this.style.boxShadow='var(--focus-ring)'"
         onfocusout="this.style.borderColor='var(--border-mid)';this.style.boxShadow='none'">
      <input
        [(ngModel)]="inputText"
        (keydown)="onKeydown($event)"
        type="text"
        placeholder="Ask Agent Zayed anything about properties…"
        class="flex-1 bg-transparent border-none outline-none py-2 text-sm"
        style="color:var(--text-primary);" />
      <button
        (click)="send()"
        class="accent-btn flex items-center justify-center rounded-xl font-bold text-lg flex-shrink-0 transition-all duration-200 cursor-pointer"
        style="width:38px;height:38px;">
        ↑
      </button>
    </div>
    <div class="text-center mt-2" style="font-size:11px;color:var(--text-muted);">
      Agent Zayed · Live property data · RERA listings · Market insights
    </div>
  </div>
</div>
