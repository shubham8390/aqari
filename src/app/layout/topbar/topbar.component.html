<header class="flex items-center gap-3 flex-shrink-0"
        style="height:64px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--bg-card);">

  <!-- Hamburger: mobile only, opens left sidebar drawer -->
  @if (layout.isMobile()) {
    <button (click)="layout.toggleSidebar()"
            class="flex items-center justify-center rounded-xl flex-shrink-0 transition-all duration-200"
            style="width:38px;height:38px;background:var(--bg-raised);border:1px solid var(--border);color:var(--text-secondary);font-size:18px;"
            aria-label="Open menu">
      ☰
    </button>
  }

  <!-- Title -->
  <div class="flex-1 min-w-0">
    <div class="font-display font-medium truncate"
         style="font-size:clamp(15px,2.5vw,20px);color:var(--text-primary);">
      {{ nav.meta().title }}
    </div>
    <div class="hidden sm:block" style="font-size:11px;color:var(--text-muted);margin-top:2px;">
      {{ nav.meta().subtitle }}
    </div>
  </div>

  <!-- Actions -->
  <div class="flex items-center gap-2 flex-shrink-0">
    <button class="hidden sm:flex text-xs px-3 py-1.5 rounded-full cursor-pointer transition-all duration-200"
            style="border:1px solid var(--border);color:var(--text-secondary);background:transparent;">
      🌐 EN / AR
    </button>
    <button class="flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-full cursor-pointer transition-all duration-200"
            style="background:var(--gold-faint);border:1px solid var(--gold-border);color:var(--gold-light);">
      ⚡ <span class="hidden sm:inline">Agent Active</span>
    </button>

    <!-- Right panel toggle: mobile only -->
    @if (layout.isMobile()) {
      <button (click)="layout.toggleRightPanel()"
              class="flex items-center justify-center rounded-xl flex-shrink-0 transition-all duration-200"
              style="width:38px;height:38px;background:var(--bg-raised);border:1px solid var(--border);color:var(--text-secondary);font-size:16px;"
              aria-label="Open insights panel">
        📊
      </button>
    }
  </div>
</header>
