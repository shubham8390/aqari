<aside class="app-rail sidebar-accent">

  @if (layout.isMobile()) {
    <button type="button" class="app-rail-close" (click)="layout.closeSidebar()" aria-label="Close menu">✕</button>
  }

  <button type="button" class="app-rail-logo-btn" (click)="goHome()" aria-label="Go to home">
    <img [src]="logoSrc" alt="Propnut" class="app-rail-logo brand-logo" />
  </button>

  <nav class="app-rail-nav">
    @for (item of visibleRailItems(); track railItemKey(item)) {
      <button
        type="button"
        class="app-rail-item"
        [class.app-rail-item--active]="isRouteActive(item)"
        [attr.aria-label]="item.label"
        (click)="onRailClick(item)">
        <span class="app-rail-icon">{{ item.icon }}</span>
        <span class="app-rail-label">{{ item.label }}</span>
      </button>
    }
  </nav>

  <button type="button" class="app-rail-user" (click)="onUserClick()">
    @if (auth.pictureUrl(); as photo) {
      <img [src]="photo" [alt]="auth.displayName()" class="user-avatar app-rail-avatar app-rail-avatar-img" />
    } @else {
      <div class="user-avatar app-rail-avatar">
        {{ auth.isAuthenticated() ? userInitials() : '?' }}
      </div>
    }
    <span class="app-rail-label app-rail-user-name">
      {{ auth.isAuthenticated() ? auth.displayName() : 'Guest' }}
    </span>
    <span class="app-rail-user-sub">
      {{ auth.isAuthenticated() ? auth.user()?.email : 'Sign in to chat' }}
    </span>
  </button>
</aside>
