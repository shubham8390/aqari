@if (profileSetup.isOpen()) {
  <div class="fixed inset-0 flex items-center justify-center p-4 view-fade"
       style="z-index:65;background:rgba(17,17,22,0.45);"
       data-overlay="true"
       (click)="onOverlayClick($event)">

    <div class="w-full max-w-lg flex flex-col rounded-2xl overflow-hidden"
         style="max-height:calc(100dvh - 2rem);background:var(--bg-card);border:1px solid var(--border);"
         (click)="$event.stopPropagation()">

      <div class="px-5 py-4 flex-shrink-0" style="border-bottom:1px solid var(--border);">
        <h2 class="font-display text-lg" style="color:var(--text-primary);">Complete your profile</h2>
        <p class="text-xs mt-1" style="color:var(--text-muted);">Help us personalize your property search</p>
      </div>

      <form class="flex-1 overflow-y-auto custom-scroll px-5 py-4 flex flex-col gap-3 min-h-0" (ngSubmit)="onSubmit()">
        @if (error) {
          <div class="text-xs px-3 py-2 rounded-lg" style="background:rgba(193,53,21,0.08);color:var(--accent-red);">{{ error }}</div>
        }

        <div>
          <label class="block text-xs font-semibold mb-1.5" style="color:var(--text-secondary);">Full name</label>
          <input [(ngModel)]="form.name" name="name" class="auth-input w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
                 style="background:var(--bg-raised);border:1px solid var(--border-mid);color:var(--text-primary);" />
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1.5" style="color:var(--text-secondary);">Phone</label>
          <input [(ngModel)]="form.phone" name="phone" class="auth-input w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
                 style="background:var(--bg-raised);border:1px solid var(--border-mid);color:var(--text-primary);" />
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1.5" style="color:var(--text-secondary);">Requirement</label>
          <input [(ngModel)]="form.requirement" name="requirement" placeholder="e.g. 2BHK"
                 class="auth-input w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
                 style="background:var(--bg-raised);border:1px solid var(--border-mid);color:var(--text-primary);" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1.5" style="color:var(--text-secondary);">Min budget</label>
            <input type="number" [(ngModel)]="form.min_budget" name="min_budget"
                   class="auth-input w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
                   style="background:var(--bg-raised);border:1px solid var(--border-mid);color:var(--text-primary);" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1.5" style="color:var(--text-secondary);">Max budget</label>
            <input type="number" [(ngModel)]="form.max_budget" name="max_budget"
                   class="auth-input w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
                   style="background:var(--bg-raised);border:1px solid var(--border-mid);color:var(--text-primary);" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1.5" style="color:var(--text-secondary);">Preferred areas</label>
          <input [(ngModel)]="form.preferred_areas" name="preferred_areas" placeholder="Baner, Wakad"
                 class="auth-input w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
                 style="background:var(--bg-raised);border:1px solid var(--border-mid);color:var(--text-primary);" />
        </div>

        @if (isBuilder) {
          <div>
            <label class="block text-xs font-semibold mb-1.5" style="color:var(--text-secondary);">Company name</label>
            <input [(ngModel)]="form.company_name" name="company_name"
                   class="auth-input w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
                   style="background:var(--bg-raised);border:1px solid var(--border-mid);color:var(--text-primary);" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1.5" style="color:var(--text-secondary);">Website</label>
            <input [(ngModel)]="form.website" name="website"
                   class="auth-input w-full rounded-xl px-3.5 py-2.5 text-sm outline-none"
                   style="background:var(--bg-raised);border:1px solid var(--border-mid);color:var(--text-primary);" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1.5" style="color:var(--text-secondary);">About your company</label>
            <textarea [(ngModel)]="form.builder_description" name="builder_description" rows="3"
                      class="auth-input w-full rounded-xl px-3.5 py-2.5 text-sm outline-none resize-none"
                      style="background:var(--bg-raised);border:1px solid var(--border-mid);color:var(--text-primary);"></textarea>
          </div>
        }

        <div class="flex gap-2 pt-2 pb-1">
          <button type="button" (click)="close()" class="flex-1 rounded-xl py-2.5 text-sm font-semibold"
                  style="background:var(--bg-raised);border:1px solid var(--border);color:var(--text-secondary);">Skip</button>
          <button type="submit" [disabled]="loading" class="accent-btn flex-1 rounded-xl py-2.5 text-sm font-semibold disabled:opacity-60">
            {{ loading ? 'Saving…' : 'Save profile' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
