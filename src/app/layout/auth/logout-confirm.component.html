@if (confirm.isOpen()) {
  <div class="fixed inset-0 flex items-center justify-center p-4 view-fade"
       style="z-index:60;background:rgba(17,17,22,0.45);"
       data-overlay="true"
       (click)="onOverlayClick($event)">

    <div class="auth-modal w-full max-w-sm flex flex-col rounded-2xl overflow-hidden"
         style="background:var(--bg-card);border:1px solid var(--border);box-shadow:0 24px 48px rgba(17,17,22,0.18);"
         role="dialog"
         aria-modal="true"
         aria-labelledby="logout-confirm-title"
         (click)="$event.stopPropagation()">

      <div class="px-5 py-4" style="border-bottom:1px solid var(--border);">
        <h2 id="logout-confirm-title" class="modal-title">Log out?</h2>
        <p class="text-xs mt-1" style="color:var(--text-muted);">
          You'll need to sign in again to chat and manage your properties.
        </p>
      </div>

      <div class="px-5 py-4 flex gap-2">
        <button type="button" (click)="close()"
                class="flex-1 rounded-xl py-2.5 text-sm font-semibold"
                style="background:var(--bg-raised);border:1px solid var(--border);color:var(--text-secondary);">
          Cancel
        </button>
        <button type="button" (click)="confirmLogout()"
                class="flex-1 rounded-xl py-2.5 text-sm font-semibold"
                style="background:var(--accent-red);border:none;color:#fff;">
          Log out
        </button>
      </div>
    </div>
  </div>
}
