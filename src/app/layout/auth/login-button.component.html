<button
  type="button"
  (click)="openLogin()"
  class="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full cursor-pointer transition-all duration-200 font-semibold"
  style="background:var(--gold);border:1px solid var(--gold);color:var(--on-accent);"
  onmouseenter="this.style.opacity='0.92'"
  onmouseleave="this.style.opacity='1'">
  <span class="hidden sm:inline">Login</span>
  <span class="sm:hidden">Login</span>
</button>
