@if (!auth.isAuthenticated()) {
  <button type="button" (click)="openLogin()"
          class="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full cursor-pointer transition-all duration-200 font-semibold"
          style="background:var(--gold);border:1px solid var(--gold);color:var(--on-accent);">
    Login
  </button>
} @else {
  <div class="flex items-center gap-2">
    <button type="button" (click)="editProfile()"
            class="hidden sm:flex text-xs px-2.5 py-1.5 rounded-full cursor-pointer"
            style="border:1px solid var(--border);color:var(--text-secondary);background:transparent;">
      {{ auth.displayName() }}
    </button>
    <button type="button" (click)="logout()"
            class="text-xs px-2.5 py-1.5 rounded-full cursor-pointer font-semibold"
            style="border:1px solid var(--border);color:var(--text-secondary);background:transparent;">
      Logout
    </button>
  </div>
}
